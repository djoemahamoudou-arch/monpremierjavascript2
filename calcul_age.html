<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
    <link rel="stylesheet" href="calcul_age.css">
     <script src="evenement.js"defer></script>
    <script src="dom_calcul_age.js"defer></script>
       





</head>
<body>
    <section>
        <article>
            
            <!--c'est pour declarer les fonction de date et l'heure -->
            <div id="date">
                <button id="validerDate">Date du jour</button>
                <span id="DateDuJour"></span>
                <br>
                <p>
                    <span id="dateDuJourFormat2"></span>
                </p>
            </div>
            <!--l'évenement qui s'appelle keydown-->
            <div id="fonctionFlech">
              <button id="boutonflech">Fonction flechiée</button>
                
            </div>

     
    <h3 id="communes"></h3>
    <ol id="listecommune">
    <li class="commune">Pamandzi</li>
    <li class="commune">Ouangani</li>
    <li class="commune">Sada</li>
    <li class="commune">Acoua</li>
    <li class="commune">Dembeni</li>
    <li class="commune">Bandraboua</li>
    <li class="commune">Mtsamboro</li>
    <li class="commune">Mtsangamouji</li>
    <li class="commune">Kani-Kéli</li>
    <li class="commune">Mamoudzou</li>
    <li class="commune">Dzaoudzi</li>
    <li class="commune">Chirongui</li>
    <li class="commune">Koungou</li>
    <li class="commune">Bouéni</li>
    <li class="commune">Chiconi</li>
    <li class="commune">Tsigoni</li>
    <li class="commune">soho</li>
    </ol>

    <form>
        <div>
            <h1><u>Formulaire</u></h1>
        </div>
      
        <div>
            <!--Zone de Nom d'utilisateur-->
        <label for="name">Nom:</label>
        <input type="text" name="name" id="nom">
        <!--Zone prenom d'utilisateur-->
        <label for="prenom">Prénom(s):</label>
        <input type="text" name="prenom" id="prenom">
        </div>
        <br>
        <div>
        <label for="">Situation :</label>
            <select id="option" name="">
                <option id="projet">Etudiant</option>
                <option id="projet">salarié</option>
            </select>
    
        </div>
        <br>
        <div>
          <label>Année de naissance :</label>
            <input type="number" id="anneeNaissance" placeholder="Année"
            min="1900" max="2025" onchange="calculerAge()">
        <!-- j'affiche le resultat sous forme de phrase. -->
            <p id="messageUtilisateur">
            Bonjour <strong><span id="nom_affiche"></span></strong>,  
            vous êtes âgé de <strong><span id="age_calcule"></span></strong> ans.

        </p>
        </div>
        <div>
          <button type="submit" id="boutonValider">Valider</button>
       
    </form>
 </article> 
</section> 



          


    

    
</body>
</html>
